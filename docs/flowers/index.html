<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Tiny Bear With a Big Message</title>
    <meta name="description" content="A shy little teddy has brought flowers and something to say." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="story-page flowers-page">
      <section class="story-card teddy-card" aria-labelledby="teddy-title">
        <div class="teddy-visual">
          <span class="teddy-sticker" aria-hidden="true">for you</span>
          <div class="teddy-halo" aria-hidden="true"></div>
          <img
            class="teddy-image"
            src="../teddy-bear.png"
            alt="A shy, smiling teddy bear holding a bouquet of daisies and peach tulips"
          />
        </div>

        <div class="teddy-copy">
          <p class="overline">a small peace offering</p>
          <h1 id="teddy-title">A tiny bear with <em>a big message.</em></h1>
          <blockquote>
            “I brought you flowers… because saying sorry needed a little extra
            courage.”
          </blockquote>

          <div class="page-actions">
            <a class="text-link" href="../">← Back</a>
            <a class="primary-link" href="../sorry/">
              Hear me out <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
