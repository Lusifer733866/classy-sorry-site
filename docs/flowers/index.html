<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Small Bouquet With a Big Message</title>
    <meta name="description" content="A small bouquet, offered with quiet courage and something sincere to say." />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="story-page flowers-page">
      <section class="story-card bouquet-card" aria-labelledby="bouquet-title">
        <div class="bouquet-visual">
          <img
            class="bouquet-image"
            src="../anime-man-bouquet.png"
            alt="An adult anime man in a white shirt offering a bouquet of peach tulips and daisies"
          />
        </div>

        <div class="bouquet-copy">
          <p class="overline">a small peace offering</p>
          <h1 id="bouquet-title">A small bouquet with <em>a big message.</em></h1>
          <blockquote>
            “I brought you flowers… because saying sorry needed a little extra
            courage.”
          </blockquote>

          <div class="page-actions">
            <a class="text-link" href="../">← Back</a>
            <a class="primary-link" href="../sorry/">
              Hear me out <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
